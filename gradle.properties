# Wake Plan — Gradle 全局配置
# 与本机无关的公共配置在这里；本机路径在 local.properties

# JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP
ksp.incremental=true

# Gradle
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.parallel=true

# 强制使用 SDK 自带的 aapt2.exe，避开 Maven daemon 版本（Windows 上 daemon 因 UCRT 缺失启动失败）
android.aapt2FromMavenOverride=D:\\Program Files\\Android\\Android SDK\\build-tools\\36.0.0\\aapt2.exe
android.enableAapt2Daemon=false
