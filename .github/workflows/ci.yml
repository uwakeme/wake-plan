name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      # 单测 + lint 是提交门槛（AGENTS.md：所有测试通过再提交推送）
      - name: Unit tests + Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      # 编译主 APK 与 androidTest（Migration 测试的编译检查；跑 connectedAndroidTest 需设备）
      - name: Assemble APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
