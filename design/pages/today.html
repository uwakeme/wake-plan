/* Wake Plan — Brand Design Tokens v4 */
/* Design Philosophy: Temporal Clarity — Bold Edition */
/* Supports: Light (default) + Dark themes */
/* Brand Prefix: wp */

/* ===== Google Fonts Import ===== */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

/* ===== LIGHT THEME (Default) ===== */
:root {
  color-scheme: light;
  --color-primary: #C48520;
  --color-primary-hover: #A86F14;
  --color-primary-light: rgba(196, 133, 32, 0.08);
  --color-primary-surface: rgba(196, 133, 32, 0.04);
  --color-bg: #F2F0EC;
  --color-bg-elevated: #FAFAF8;
  --color-bg-overlay: #EAE7E2;
  --color-bg-card: #FFFFFF;
  --color-bg-card-hover: #F8F7F5;
  --color-bg-input: #EAE7E2;
  --color-text-primary: #18160F;
  --color-text-secondary: #6E695E;
  --color-text-tertiary: #A5A099;
  --color-text-inverse: #FAFAF8;
  --color-border: rgba(24, 22, 15, 0.07);
  --color-border-strong: rgba(24, 22, 15, 0.14);
  --color-border-subtle: rgba(24, 22, 15, 0.03);
  --state-success: #2E9B5E;
  --state-success-light: rgba(46, 155, 94, 0.08);
  --state-warning: #D4901A;
  --state-warning-light: rgba(212, 144, 26, 0.08);
  --state-error: #C84545;
  --state-error-light: rgba(200, 69, 69, 0.08);
  --state-info: #3B6FB5;
  --state-info-light: rgba(59, 111, 181, 0.08);
  --font-display: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-body: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --text-2xs: 10px; --text-2xs-lh: 14px;
  --text-xs: 11px; --text-xs-lh: 16px;
  --text-sm: 13px; --text-sm-lh: 18px;
  --text-base: 15px; --text-base-lh: 22px;
  --text-lg: 17px; --text-lg-lh: 24px;
  --text-xl: 20px; --text-xl-lh: 28px;
  --text-2xl: 28px; --text-2xl-lh: 36px;
  --text-3xl: 36px; --text-3xl-lh: 44px;
  --text-display: 60px; --text-display-lh: 66px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --letter-spacing-tight: -0.04em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.06em;
  --letter-spacing-wider: 0.12em;
  --space-2xs: 2px; --space-xs: 4px; --space-sm: 8px; --space-md: 12px;
  --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px;
  --space-3xl: 32px; --space-4xl: 40px; --space-5xl: 56px;
  --radius-xs: 6px; --radius-sm: 8px; --radius-md: 12px;
  --radius-lg: 16px; --radius-xl: 22px; --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03), 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
  --shadow-glow-primary: 0 0 30px rgba(196, 133, 32, 0.15), 0 0 8px rgba(196, 133, 32, 0.08);
  --shadow-glow-success: 0 0 20px rgba(46, 155, 94, 0.12);
  --transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 260ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 380ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-toggle: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-spring: 480ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-bounce: 600ms cubic-bezier(0.22, 1, 0.36, 1);
  --noise-opacity: 0.008;
  --toggle-off-track: rgba(24, 22, 15, 0.08);
  --toggle-off-knob: #FFFFFF;
  --toggle-on-track: #C48520;
  --toggle-on-knob: #FFFFFF;
  --tab-bar-bg: rgba(250, 250, 248, 0.90);
}

/* ===== DARK THEME ===== */
html.dark {
  color-scheme: dark;
  --color-primary: #F0B44A;
  --color-primary-hover: #D4962E;
  --color-primary-light: rgba(240, 180, 74, 0.10);
  --color-primary-surface: rgba(240, 180, 74, 0.05);
  --color-bg: #090E1A;
  --color-bg-elevated: #121A2C;
  --color-bg-overlay: #0F1626;
  --color-bg-card: #151E32;
  --color-bg-card-hover: #1B2640;
  --color-bg-input: #0F1626;
  --color-text-primary: #F0F2F8;
  --color-text-secondary: #8492AD;
  --color-text-tertiary: #4F5E78;
  --color-text-inverse: #090E1A;
  --color-border: rgba(132, 146, 173, 0.08);
  --color-border-strong: rgba(132, 146, 173, 0.18);
  --color-border-subtle: rgba(132, 146, 173, 0.04);
  --state-success: #5DB88A;
  --state-success-light: rgba(93, 184, 138, 0.10);
  --state-warning: #F0B44A;
  --state-warning-light: rgba(240, 180, 74, 0.10);
  --state-error: #E85C5C;
  --state-error-light: rgba(232, 92, 92, 0.10);
  --state-info: #4A90D9;
  --state-info-light: rgba(74, 144, 217, 0.10);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.10), 0 1px 4px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.16), 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.22), 0 4px 16px rgba(0, 0, 0, 0.10);
  --shadow-glow-primary: 0 0 30px rgba(240, 180, 74, 0.18), 0 0 8px rgba(240, 180, 74, 0.10);
  --shadow-glow-success: 0 0 20px rgba(93, 184, 138, 0.14);
  --noise-opacity: 0.018;
  --toggle-off-track: rgba(132, 146, 173, 0.14);
  --toggle-off-knob: #8492AD;
  --toggle-on-track: #F0B44A;
  --toggle-on-knob: #FFFFFF;
  --tab-bar-bg: #121A2C;
}

/* ===== Shared Entrance Animations ===== */
@keyframes wp-fade-in-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes wp-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes wp-scale-in {
  from { opacity: 0; transform: scale(0.90); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes wp-progress-fill {
  from { width: 0; }
}
@keyframes wp-slide-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes wp-slide-down {
  from { opacity: 0; max-height: 0; }
  to { opacity: 1; max-height: 400px; }
}
.wp-animate-in {
  animation: wp-fade-in-up 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.wp-animate-scale {
  animation: wp-scale-in 400ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.wp-animate-fade {
  animation: wp-fade-in 320ms ease both;
}
.wp-animate-progress {
  animation: wp-progress-fill 680ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ===== Accessibility ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

    <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* ===== Noise Texture Overlay ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: var(--noise-opacity, 0.025);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 200px 200px;
    }

    /* ===== Shell ===== */
    .wp-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      background: var(--color-bg);
      position: relative;
      overflow: hidden;
    }

    /* ===== Status Bar Safe Area ===== */
    .wp-status-bar {
      height: env(safe-area-inset-top, 0px);
      min-height: env(safe-area-inset-top, 0px);
      flex-shrink: 0;
      background: var(--color-bg);
    }

    /* ===== Scrollable Page Content ===== */
    .wp-page-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .wp-page-content::-webkit-scrollbar {
      display: none;
    }
    .wp-page-content {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ===== TOP FIXED AREA ===== */
    .wp-today-header {
      padding: 24px 20px 0 20px;
      background: var(--color-bg);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .wp-greeting {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 13px;
      line-height: 18px;
      font-weight: 400;
      color: var(--color-text-secondary);
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }

    .wp-clock-wrap {
      position: relative;
      display: inline-block;
      margin: 8px 0 4px 0;
    }

    /* Subtle radial glow behind clock — pseudo-element, NOT text-shadow */
    .wp-clock-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 180px;
      background: radial-gradient(ellipse at center, rgba(232, 168, 62, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    .wp-clock {
      font-family: 'Outfit', sans-serif;
      font-size: 56px;
      line-height: 62px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-text-primary);
    }

    .wp-date-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      padding: 5px 14px;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: 9999px;
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      line-height: 16px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--color-text-tertiary);
    }

    .wp-subtitle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      margin-bottom: 4px;
    }

    .wp-subtitle-label {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    /* ===== Pulsing Dots ===== */
    .wp-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
      position: relative;
      flex-shrink: 0;
    }

    .wp-pulse-dot::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--color-primary);
      opacity: 0.4;
      animation: wp-pulse-dot 2.5s ease-in-out infinite;
    }

    .wp-pulse-dot--green {
      background: var(--state-success);
    }

    .wp-pulse-dot--green::before {
      background: var(--state-success);
      animation: wp-pulse-dot 2.5s ease-in-out infinite;
    }

    @keyframes wp-pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.8); opacity: 0; }
    }

    /* ===== TASK CARDS ===== */
    .wp-task-list {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .wp-task-card {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 20px 20px 18px 24px;
      position: relative;
      overflow: hidden;
      transition: border-color 280ms cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .wp-task-card:hover {
      border-color: var(--color-border-strong);
    }

    .wp-task-card__stripe {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 14px 0 0 14px;
    }

    .wp-task-card__plan-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      line-height: 14px;
      font-weight: 400;
      letter-spacing: 0.10em;
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .wp-plan-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .wp-task-card__title {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 4px;
    }

    .wp-task-card__time {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
      color: var(--color-text-tertiary);
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }

    .wp-task-card__status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .wp-task-card__status--active {
      color: var(--state-success);
    }

    .wp-task-card__status--upcoming {
      color: var(--color-primary);
    }

    .wp-task-card__status--waiting {
      color: var(--color-text-tertiary);
    }

    .wp-task-card__elapsed {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: var(--color-text-tertiary);
      font-weight: 400;
      margin-left: 2px;
    }

    .wp-task-card__actions {
      display: flex;
      gap: 8px;
    }

    /* ===== Buttons ===== */
    .wp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      padding: 8px 20px;
      border: none;
      cursor: pointer;
      transition: background 280ms cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 280ms cubic-bezier(0.4, 0, 0.2, 1),
                  color 280ms cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .wp-btn:focus-visible,
    .wp-btn-primary:focus-visible,
    .wp-btn-secondary:focus-visible {
      box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-primary);
    }

    .wp-btn--primary {
      background: var(--color-primary);
      color: var(--color-text-inverse);
    }

    .wp-btn--primary:hover {
      background: var(--color-primary-hover);
    }

    .wp-btn--outline {
      background: transparent;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border-strong);
    }

    .wp-btn--outline:hover {
      border-color: var(--color-primary);
      color: var(--color-text-primary);
    }

    .wp-btn:active {
      transform: scale(0.96);
      transition-duration: 100ms;
    }

    /* ===== Today Timeline (Redesigned) ===== */
    .wp-today-timeline {
      padding: 8px 20px 32px 20px;
    }

    .wp-tl-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .wp-tl-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wp-tl-label {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      line-height: 14px;
      font-weight: 400;
      letter-spacing: 0.10em;
      color: var(--color-text-tertiary);
      text-transform: uppercase;
    }

    .wp-tl-count {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 11px;
      line-height: 14px;
      color: var(--color-text-tertiary);
    }

    .wp-tl-progress {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-primary);
      letter-spacing: 0.02em;
    }

    /* Timeline card container */
    .wp-tl-card {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 14px 16px 12px;
      overflow: hidden;
    }

    /* Hour labels row */
    .wp-tl-axis {
      position: relative;
      margin-bottom: 6px;
    }

    .wp-tl-hours {
      position: relative;
      height: 14px;
      margin-bottom: 4px;
    }

    .wp-tl-hours span {
      position: absolute;
      font-family: 'Geist Mono', monospace;
      font-size: 9px;
      color: var(--color-text-tertiary);
      opacity: 0.6;
      transform: translateX(-50%);
      letter-spacing: 0.02em;
    }

    /* Track area where blocks sit */
    .wp-tl-track {
      position: relative;
      height: 28px;
      margin-bottom: 4px;
    }

    /* Individual task block */
    .wp-tl-slot {
      position: absolute;
      inset: 0;
    }

    .wp-tl-block {
      position: absolute;
      top: 2px;
      height: 24px;
      border-radius: 6px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: opacity 180ms ease, transform 180ms ease;
      animation: wp-progress-fill 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 400ms;
    }

    .wp-tl-block:hover {
      opacity: 1;
      transform: scaleY(1.15);
      z-index: 2;
    }

    .wp-tl-block--past {
      opacity: 0.4;
    }

    .wp-tl-block--past::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,0.08) 3px,
        rgba(255,255,255,0.08) 6px
      );
    }

    .wp-tl-block-label {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      letter-spacing: 0.01em;
    }

    /* Current time indicator */
    .wp-tl-now {
      position: absolute;
      top: -2px;
      bottom: -2px;
      z-index: 5;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .wp-tl-now-line {
      width: 2px;
      height: 100%;
      background: var(--color-primary);
      border-radius: 1px;
      box-shadow: 0 0 6px rgba(232, 168, 62, 0.4);
    }

    .wp-tl-now-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 8px rgba(232, 168, 62, 0.5);
      animation: wp-tl-pulse 2s ease-in-out infinite;
    }

    @keyframes wp-tl-pulse {
      0%, 100% { box-shadow: 0 0 8px rgba(232, 168, 62, 0.5); }
      50% { box-shadow: 0 0 16px rgba(232, 168, 62, 0.7); }
    }

    /* Tick marks */
    .wp-tl-ticks {
      position: relative;
      height: 4px;
    }

    .wp-tl-ticks span {
      position: absolute;
      width: 1px;
      height: 100%;
      background: var(--color-border-subtle);
      transform: translateX(-50%);
    }

    /* Legend / summary row */
    .wp-tl-legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--color-border-subtle);
    }

    .wp-tl-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wp-tl-legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .wp-tl-legend-text {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--color-text-primary);
      flex: 1;
      min-width: 0;
    }

    .wp-tl-legend-text--done {
      text-decoration: line-through;
      opacity: 0.45;
    }

    .wp-tl-legend-time {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      color: var(--color-text-tertiary);
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    /* ===== BOTTOM TAB BAR ===== */
    .wp-tab-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 60px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--tab-bar-bg);
      border-top: 1px solid var(--color-border-subtle);
      position: relative;
      z-index: 100;
    }

    .wp-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-tertiary);
      transition: color 280ms cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    .wp-tab:focus-visible {
      box-shadow: 0 0 0 2px var(--color-primary);
      border-radius: 8px;
    }

    .wp-tab:hover {
      color: var(--color-text-secondary);
    }

    .wp-tab svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke: currentColor;
      transition: stroke 280ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .wp-tab--active {
      color: var(--color-primary);
    }

    /* Dot indicator below active tab icon */
    .wp-tab--active::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-primary);
      opacity: 1;
    }

    .wp-tab-label {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 10px;
      line-height: 14px;
      font-weight: 500;
      letter-spacing: 0.06em;
      transition: color 280ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== Theme Toggle ===== */
    .wp-theme-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-tertiary);
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
      transition: color var(--transition-fast), background var(--transition-fast);
    }
    .wp-theme-toggle:hover {
      color: var(--color-text-secondary);
      background: var(--color-primary-light);
    }
    .wp-theme-toggle:focus-visible {
      box-shadow: 0 0 0 2px var(--color-primary);
    }
    .wp-theme-toggle__icon--light { display: none; }
    html.dark .wp-theme-toggle__icon--light { display: block; }
    html.dark .wp-theme-toggle__icon--dark { display: none; }

    /* ===== Theme Transition ===== */
    html.theme-transitioning,
    html.theme-transitioning *,
    html.theme-transitioning *::before,
    html.theme-transitioning *::after {
      transition: background-color 500ms cubic-bezier(0.4, 0, 0.2, 1),
                  color 500ms cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 500ms cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 500ms cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    </style>

<script>
function toggleTheme() {
  const html = document.documentElement;
  html.classList.add('theme-transitioning');
  html.classList.toggle('dark');
  localStorage.setItem('wp-theme', html.classList.contains('dark') ? 'dark' : 'light');
  setTimeout(() => html.classList.remove('theme-transitioning'), 500);
}
(function() {
  const saved = localStorage.getItem('wp-theme');
  if (saved === 'dark') document.documentElement.classList.add('dark');
  else if (saved === 'light') document.documentElement.classList.remove('dark');
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
})();
</script>
</body>
