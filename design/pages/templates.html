/* Wake Plan — Brand Design Tokens v4 */
/* Design Philosophy: Temporal Clarity — Bold Edition */
/* Supports: Light (default) + Dark themes */
/* Brand Prefix: wp */

/* ===== Google Fonts Import ===== */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

/* ===== LIGHT THEME (Default) ===== */
:root {
  color-scheme: light;
  --color-primary: #C48520;
  --color-primary-hover: #A86F14;
  --color-primary-light: rgba(196, 133, 32, 0.08);
  --color-primary-surface: rgba(196, 133, 32, 0.04);
  --color-bg: #F2F0EC;
  --color-bg-elevated: #FAFAF8;
  --color-bg-overlay: #EAE7E2;
  --color-bg-card: #FFFFFF;
  --color-bg-card-hover: #F8F7F5;
  --color-bg-input: #EAE7E2;
  --color-text-primary: #18160F;
  --color-text-secondary: #6E695E;
  --color-text-tertiary: #A5A099;
  --color-text-inverse: #FAFAF8;
  --color-border: rgba(24, 22, 15, 0.07);
  --color-border-strong: rgba(24, 22, 15, 0.14);
  --color-border-subtle: rgba(24, 22, 15, 0.03);
  --state-success: #2E9B5E;
  --state-success-light: rgba(46, 155, 94, 0.08);
  --state-warning: #D4901A;
  --state-warning-light: rgba(212, 144, 26, 0.08);
  --state-error: #C84545;
  --state-error-light: rgba(200, 69, 69, 0.08);
  --state-info: #3B6FB5;
  --state-info-light: rgba(59, 111, 181, 0.08);
  --font-display: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-body: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --text-2xs: 10px; --text-2xs-lh: 14px;
  --text-xs: 11px; --text-xs-lh: 16px;
  --text-sm: 13px; --text-sm-lh: 18px;
  --text-base: 15px; --text-base-lh: 22px;
  --text-lg: 17px; --text-lg-lh: 24px;
  --text-xl: 20px; --text-xl-lh: 28px;
  --text-2xl: 28px; --text-2xl-lh: 36px;
  --text-3xl: 36px; --text-3xl-lh: 44px;
  --text-display: 60px; --text-display-lh: 66px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --letter-spacing-tight: -0.04em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.06em;
  --letter-spacing-wider: 0.12em;
  --space-2xs: 2px; --space-xs: 4px; --space-sm: 8px; --space-md: 12px;
  --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px;
  --space-3xl: 32px; --space-4xl: 40px; --space-5xl: 56px;
  --radius-xs: 6px; --radius-sm: 8px; --radius-md: 12px;
  --radius-lg: 16px; --radius-xl: 22px; --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03), 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
  --shadow-glow-primary: 0 0 30px rgba(196, 133, 32, 0.15), 0 0 8px rgba(196, 133, 32, 0.08);
  --shadow-glow-success: 0 0 20px rgba(46, 155, 94, 0.12);
  --transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 260ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 380ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-toggle: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-spring: 480ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-bounce: 600ms cubic-bezier(0.22, 1, 0.36, 1);
  --noise-opacity: 0.008;
  --toggle-off-track: rgba(24, 22, 15, 0.08);
  --toggle-off-knob: #FFFFFF;
  --toggle-on-track: #C48520;
  --toggle-on-knob: #FFFFFF;
  --tab-bar-bg: rgba(250, 250, 248, 0.90);
}

/* ===== DARK THEME ===== */
html.dark {
  color-scheme: dark;
  --color-primary: #F0B44A;
  --color-primary-hover: #D4962E;
  --color-primary-light: rgba(240, 180, 74, 0.10);
  --color-primary-surface: rgba(240, 180, 74, 0.05);
  --color-bg: #090E1A;
  --color-bg-elevated: #121A2C;
  --color-bg-overlay: #0F1626;
  --color-bg-card: #151E32;
  --color-bg-card-hover: #1B2640;
  --color-bg-input: #0F1626;
  --color-text-primary: #F0F2F8;
  --color-text-secondary: #8492AD;
  --color-text-tertiary: #4F5E78;
  --color-text-inverse: #090E1A;
  --color-border: rgba(132, 146, 173, 0.08);
  --color-border-strong: rgba(132, 146, 173, 0.18);
  --color-border-subtle: rgba(132, 146, 173, 0.04);
  --state-success: #5DB88A;
  --state-success-light: rgba(93, 184, 138, 0.10);
  --state-warning: #F0B44A;
  --state-warning-light: rgba(240, 180, 74, 0.10);
  --state-error: #E85C5C;
  --state-error-light: rgba(232, 92, 92, 0.10);
  --state-info: #4A90D9;
  --state-info-light: rgba(74, 144, 217, 0.10);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.10), 0 1px 4px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.16), 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.22), 0 4px 16px rgba(0, 0, 0, 0.10);
  --shadow-glow-primary: 0 0 30px rgba(240, 180, 74, 0.18), 0 0 8px rgba(240, 180, 74, 0.10);
  --shadow-glow-success: 0 0 20px rgba(93, 184, 138, 0.14);
  --noise-opacity: 0.018;
  --toggle-off-track: rgba(132, 146, 173, 0.14);
  --toggle-off-knob: #8492AD;
  --toggle-on-track: #F0B44A;
  --toggle-on-knob: #FFFFFF;
  --tab-bar-bg: #121A2C;
}

/* ===== Shared Entrance Animations ===== */
@keyframes wp-fade-in-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes wp-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes wp-scale-in {
  from { opacity: 0; transform: scale(0.90); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes wp-progress-fill {
  from { width: 0; }
}
@keyframes wp-slide-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes wp-slide-down {
  from { opacity: 0; max-height: 0; }
  to { opacity: 1; max-height: 400px; }
}
.wp-animate-in {
  animation: wp-fade-in-up 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.wp-animate-scale {
  animation: wp-scale-in 400ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.wp-animate-fade {
  animation: wp-fade-in 320ms ease both;
}
.wp-animate-progress {
  animation: wp-progress-fill 680ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ===== Accessibility ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: var(--color-bg);
        color: var(--color-text-primary);
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;

      /* Noise texture overlay */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: var(--noise-opacity);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 256px 256px;
      }

      .page-shell {
        width: 390px;
        max-width: 100vw;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      /* Scrollable content */
      .scroll-area {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 20px 40px;
        padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      }
      .scroll-area::-webkit-scrollbar { display: none; }
      .scroll-area { -ms-overflow-style: none; scrollbar-width: none; }

      /* Top bar */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        padding-top: calc(14px + env(safe-area-inset-top, 0px));
        flex-shrink: 0;
        height: 56px;
      }

      .top-bar .back-btn {
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        background: none; border: none;
        color: var(--color-text-primary);
        cursor: pointer;
        border-radius: var(--radius-full);
        transition: background var(--transition-fast);
      }
      .top-bar .back-btn:hover { background: var(--color-border-subtle); }

      .top-bar .title {
        font-family: 'Outfit', sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--color-text-primary);
      }

      .top-bar .manage-btn {
        background: none; border: none;
        color: var(--color-primary);
        font-family: 'Outfit', sans-serif;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        padding: 8px 12px;
        border-radius: var(--radius-full);
        transition: background var(--transition-fast);
      }
      .top-bar .manage-btn:hover { background: var(--color-primary-surface); }

      /* Search */
      .search-wrap {
        position: relative;
        margin-bottom: 10px;
      }
      .search-wrap svg {
        position: absolute;
        left: 14px; top: 50%;
        transform: translateY(-50%);
        color: var(--color-text-tertiary);
        pointer-events: none;
      }
      .search-wrap input {
        width: 100%;
        height: 44px;
        padding: 0 16px 0 42px;
        border: 1px solid var(--color-border);
        border-radius: 10px;
        background: var(--color-bg-input);
        color: var(--color-text-primary);
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 13px;
        outline: none;
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      }
      .search-wrap input::placeholder { color: var(--color-text-tertiary); }
      .search-wrap input:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px var(--color-primary-surface);
      }

      /* Search hint */
      .search-hint {
        margin-bottom: 24px;
        padding-left: 2px;
      }
      .search-hint .hint-text {
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 12px;
        color: var(--color-text-tertiary);
        letter-spacing: 0.01em;
        line-height: 16px;
      }

      /* Section label */
      .section-label {
        font-family: 'Outfit', sans-serif;
        font-size: 10px;
        font-weight: 600;
        color: var(--color-text-tertiary);
        letter-spacing: 0.10em;
        text-transform: uppercase;
        margin-bottom: 14px;
        padding-left: 2px;
      }

      /* Template cards list */
      .cards-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 32px;
      }

      /* Card */
      .tpl-card {
        background: var(--color-bg-card);
        border-radius: 14px;
        border: 1px solid var(--color-border);
        position: relative;
        transition: transform var(--transition-fast),
                    border-color var(--transition-fast),
                    box-shadow var(--transition-fast);
      }
      .tpl-card::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        border-radius: 0 3px 3px 0;
        z-index: 1;
      }
      .tpl-card--warm::before { background: #C48520; }
      .tpl-card--cool::before { background: #6366E8; }
      .tpl-card--green::before { background: #34B87A; }

      .tpl-card:hover {
        border-color: var(--color-border-strong);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        transform: scale(1.005) translateY(-2px);
      }

      .tpl-card:active {
        transform: scale(0.985) translateY(0);
        transition-duration: 120ms;
      }

      /* Card title row with inline icon */
      .card-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .card-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .card-icon svg {
        width: 16px;
        height: 16px;
      }
      .card-icon--warm {
        background: rgba(196, 133, 32, 0.10);
        color: #C48520;
      }
      html.dark .card-icon--warm {
        background: rgba(232, 168, 62, 0.12);
        color: #E8A83E;
      }
      .card-icon--cool {
        background: rgba(99, 102, 232, 0.10);
        color: #6366E8;
      }
      html.dark .card-icon--cool {
        background: rgba(139, 132, 248, 0.12);
        color: #8B84F8;
      }
      .card-icon--green {
        background: rgba(52, 184, 122, 0.10);
        color: #28A56A;
      }
      html.dark .card-icon--green {
        background: rgba(93, 184, 138, 0.12);
        color: #5DB88A;
      }

      /* Inline badges */
      .card-badge-inline {
        margin-left: auto;
        padding: 2px 8px;
        border-radius: var(--radius-full);
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        line-height: 16px;
        flex-shrink: 0;
      }
      .badge--popular {
        background: rgba(196, 133, 32, 0.08);
        color: #C48520;
      }
      html.dark .badge--popular {
        background: rgba(232, 168, 62, 0.10);
        color: #E8A83E;
      }
      .badge--method {
        background: rgba(99, 102, 232, 0.08);
        color: #6366E8;
      }
      html.dark .badge--method {
        background: rgba(139, 132, 248, 0.10);
        color: #8B84F8;
      }
      .badge--relax {
        background: rgba(52, 184, 122, 0.08);
        color: #28A56A;
      }
      html.dark .badge--relax {
        background: rgba(93, 184, 138, 0.10);
        color: #5DB88A;
      }

      /* Card body */
      .tpl-card .card-body {
        padding: 16px 18px 18px;
      }

      .tpl-card .card-title {
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--color-text-primary);
        margin-bottom: 6px;
        line-height: 1.3;
      }

      .tpl-card .card-desc {
        font-size: 13px;
        line-height: 18px;
        color: var(--color-text-secondary);
        margin-bottom: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .tpl-card .card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-family: 'Geist Mono', monospace;
        font-size: 11px;
        color: var(--color-text-tertiary);
      }
      .tpl-card .card-meta .dot {
        width: 3px; height: 3px;
        border-radius: 50%;
        background: var(--color-text-tertiary);
        flex-shrink: 0;
      }

      .tpl-card .card-tags {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }
      .tpl-card .tag {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        border-radius: var(--radius-full);
        border: 1px solid var(--color-border-strong);
        font-size: 11px;
        font-weight: 500;
        color: var(--color-text-secondary);
        background: transparent;
        line-height: 16px;
      }

      /* Task preview (collapsible) */
      .task-preview {
        margin-bottom: 14px;
      }
      .task-preview-toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: none;
        border: none;
        color: var(--color-primary);
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        padding: 4px 0;
        border-radius: var(--radius-xs);
        transition: opacity var(--transition-fast);
        letter-spacing: 0.01em;
      }
      .task-preview-toggle:hover { opacity: 0.75; }
      .task-preview-toggle .chevron-icon {
        transition: transform var(--transition-fast);
      }
      .task-preview-toggle[aria-expanded="true"] .chevron-icon {
        transform: rotate(180deg);
      }
      .task-preview-list {
        display: none;
        flex-direction: column;
        gap: 0;
        margin-top: 8px;
        padding: 10px 12px;
        background: var(--color-bg-overlay);
        border-radius: var(--radius-sm);
        max-height: 0;
        overflow: hidden;
        transition: max-height 300ms cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 200ms ease,
                    margin-top 300ms cubic-bezier(0.22, 1, 0.36, 1);
        opacity: 0;
      }
      .task-preview-list.is-open {
        display: flex;
        max-height: 200px;
        opacity: 1;
      }
      .task-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 1px solid var(--color-border-subtle);
        cursor: default;
      }
      .task-item:last-child { border-bottom: none; padding-bottom: 0; }
      .task-item:first-child { padding-top: 0; }
      .task-check {
        width: 16px; height: 16px;
        border-radius: 4px;
        border: 1.5px solid var(--color-border-strong);
        background: var(--color-bg-card);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .task-name {
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 13px;
        font-weight: 400;
        color: var(--color-text-primary);
        flex: 1;
      }
      .task-dur {
        font-family: 'Geist Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: var(--color-text-tertiary);
        letter-spacing: 0.04em;
        flex-shrink: 0;
      }

      /* Use template button */
      .tpl-card .use-btn {
        width: 100%;
        height: 38px;
        border: 1.5px solid var(--color-primary);
        border-radius: 8px;
        background: transparent;
        color: var(--color-primary);
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition-fast);
        letter-spacing: -0.01em;
      }
      .tpl-card .use-btn:hover {
        background: var(--color-primary);
        color: var(--color-text-inverse);
        box-shadow: 0 0 16px rgba(232, 168, 62, 0.15);
      }

      .tpl-card .use-btn:active {
        transform: scale(0.96);
        transition-duration: 100ms;
      }

      /* My Templates section */
      .my-templates-section {
        margin-bottom: 32px;
      }

      /* Empty state */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px 44px;
        background: var(--color-bg-card);
        border-radius: 14px;
        border: 1px dashed var(--color-border-strong);
      }

      /* CSS illustration for empty state */
      .empty-illustration {
        position: relative;
        width: 80px;
        height: 64px;
        margin-bottom: 20px;
      }
      .empty-shape--back {
        position: absolute;
        left: 24px; bottom: 4px;
        width: 40px; height: 52px;
        border-radius: 3px 6px 6px 3px;
        background: var(--color-border-strong);
        opacity: 0.40;
      }
      .empty-shape--front {
        position: absolute;
        left: 16px; bottom: 0;
        width: 40px; height: 52px;
        border-radius: 3px 6px 6px 3px;
        background: var(--color-bg-overlay);
        border: 1.5px solid var(--color-border-strong);
      }
      .empty-shape--front::before {
        content: '';
        position: absolute;
        left: 6px; top: 10px;
        width: 22px; height: 1.5px;
        background: var(--color-border);
        border-radius: 1px;
        box-shadow: 0 7px 0 var(--color-border), 0 14px 0 var(--color-border), 0 21px 0 var(--color-border);
      }
      .empty-shape--dot {
        position: absolute;
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--color-primary);
        opacity: 0.35;
      }
      .empty-shape--dot1 { right: 10px; top: 12px; }
      .empty-shape--dot2 { right: 6px; top: 24px; opacity: 0.22; }
      .empty-shape--dot3 { right: 14px; top: 34px; opacity: 0.28; }
      .empty-shape--accent {
        position: absolute;
        left: 60px; bottom: 8px;
        width: 14px; height: 14px;
        border-radius: 50%;
        border: 2px solid var(--color-primary);
        opacity: 0.18;
      }

      .empty-state .empty-title {
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 15px;
        font-weight: 500;
        color: var(--color-text-secondary);
        margin-bottom: 6px;
      }
      .empty-state .empty-sub {
        font-size: 13px;
        color: var(--color-text-tertiary);
        text-align: center;
        margin-bottom: 20px;
        line-height: 18px;
      }
      .empty-state .create-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: none;
        border: none;
        color: var(--color-primary);
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        padding: 8px 16px;
        border-radius: var(--radius-full);
        transition: background var(--transition-fast);
      }
      .empty-state .create-btn:hover {
        background: var(--color-primary-surface);
      }
      .empty-state .create-btn svg {
        flex-shrink: 0;
      }

      /* ===== Card Actions Row ===== */
      .card-actions-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }

      .preview-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: none;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        color: var(--color-text-secondary);
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 12px;
        cursor: pointer;
        transition: all var(--transition-fast);
        -webkit-tap-highlight-color: transparent;
      }
      .preview-btn:hover {
        border-color: var(--color-primary);
        color: var(--color-primary);
        background: var(--color-primary-surface);
      }
      .preview-btn:active {
        transform: scale(0.96);
        transition-duration: 100ms;
      }

      /* ===== Preview Overlay ===== */
      .preview-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0);
        pointer-events: none;
        transition: background 300ms ease;
      }
      .preview-overlay.active {
        background: rgba(0, 0, 0, 0.4);
        pointer-events: auto;
      }

      /* ===== Preview Sheet ===== */
      .preview-sheet {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        max-width: 390px;
        margin: 0 auto;
        max-height: 85vh;
        background: var(--color-bg-card);
        border-radius: 20px 20px 0 0;
        display: flex;
        flex-direction: column;
        transform: translateY(100%);
        transition: transform 380ms cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.15);
      }
      .preview-overlay.active .preview-sheet {
        transform: translateY(0);
      }

      /* Sheet handle */
      .preview-sheet-handle {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--color-border-strong);
        margin: 10px auto 0;
        flex-shrink: 0;
        cursor: pointer;
      }

      /* Sheet header */
      .preview-sheet-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 20px 14px;
        border-bottom: 1px solid var(--color-border);
        flex-shrink: 0;
      }

      .preview-sheet-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .preview-sheet-title {
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--color-text-primary);
        line-height: 1.3;
      }

      .preview-sheet-meta {
        font-family: 'Geist Mono', monospace;
        font-size: 11px;
        color: var(--color-text-tertiary);
        margin-top: 2px;
        letter-spacing: 0.02em;
      }

      .preview-sheet-close {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        color: var(--color-text-tertiary);
        cursor: pointer;
        border-radius: var(--radius-full);
        margin-left: auto;
        flex-shrink: 0;
        transition: background var(--transition-fast), color var(--transition-fast);
      }
      .preview-sheet-close:hover {
        background: var(--color-bg-overlay);
        color: var(--color-text-primary);
      }

      /* Sheet body */
      .preview-sheet-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px 8px;
        -webkit-overflow-scrolling: touch;
      }
      .preview-sheet-body::-webkit-scrollbar { display: none; }
      .preview-sheet-body { scrollbar-width: none; }

      /* ===== Timeline Bar ===== */
      .pv-timeline-wrap {
        padding: 0 20px 14px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--color-border);
      }

      .pv-timeline-bar {
        position: relative;
        height: 6px;
        background: var(--color-bg-overlay);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 8px;
      }

      .pv-timeline-fill {
        position: absolute;
        inset: 0;
        display: flex;
        gap: 2px;
      }

      .pv-tl-seg {
        position: absolute;
        height: 100%;
        border-radius: 3px;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
      }
      .preview-overlay.active .pv-tl-seg {
        transform: scaleX(1);
      }

      .pv-timeline-labels {
        display: flex;
        justify-content: space-between;
      }

      .pv-tl-label {
        font-family: 'Geist Mono', monospace;
        font-size: 10px;
        color: var(--color-text-tertiary);
        letter-spacing: 0.04em;
      }

      .pv-timeline-range {
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 11px;
        color: var(--color-text-secondary);
        text-align: center;
        margin-top: 4px;
        letter-spacing: 0.01em;
      }

      /* Segment block */
      .pv-segment {
        margin-bottom: 20px;
      }
      .pv-segment:last-child { margin-bottom: 0; }

      .pv-segment-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        padding: 8px 12px;
        background: var(--color-bg-overlay);
        border-radius: var(--radius-md);
      }

      .pv-segment-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 6px currentColor;
      }

      .pv-segment-label {
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
        line-height: 1.3;
      }

      .pv-segment-time {
        font-family: 'Geist Mono', monospace;
        font-size: 11px;
        color: var(--color-text-tertiary);
        margin-top: 1px;
        letter-spacing: 0.02em;
      }

      /* Segment tasks */
      .pv-segment-tasks {
        padding-left: 14px;
        border-left: 2px solid var(--color-border);
        margin-left: 3px;
      }

      .pv-task-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--color-border-subtle);
      }
      .pv-task-row:last-child { border-bottom: none; }

      .pv-task-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--color-border-strong);
        flex-shrink: 0;
        margin-left: -1px;
      }

      .pv-task-info {
        flex: 1;
        min-width: 0;
      }

      .pv-task-bar {
        flex: 1;
        height: 4px;
        background: var(--color-bg-overlay);
        border-radius: 2px;
        overflow: hidden;
        min-width: 40px;
      }
      .pv-task-bar-fill {
        height: 100%;
        border-radius: 2px;
        background: var(--color-text-tertiary);
        opacity: 0.5;
        transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .pv-task-name {
        font-family: 'Outfit', 'Noto Sans SC', sans-serif;
        font-size: 13px;
        font-weight: 400;
        color: var(--color-text-primary);
      }

      .pv-task-time {
        font-family: 'Geist Mono', monospace;
        font-size: 10px;
        color: var(--color-text-tertiary);
        flex-shrink: 0;
        letter-spacing: 0.02em;
      }

      .pv-task-dur {
        font-family: 'Geist Mono', monospace;

function openPreview(idx) {
  const data = templateData[idx];
  const overlay = document.getElementById('previewOverlay');
  const iconEl = document.getElementById('previewIcon');
  const titleEl = document.getElementById('previewTitle');
  const metaEl = document.getElementById('previewMeta');
  const bodyEl = document.getElementById('previewBody');
  const useBtn = document.getElementById('previewUseBtn');

  iconEl.innerHTML = data.icon;
  iconEl.style.background = data.iconBg;
  iconEl.style.color = data.iconColor;
  titleEl.textContent = data.title;
  metaEl.textContent = data.meta;

  let bodyHTML = '';
  data.segments.forEach(function(seg, si) {
    bodyHTML += '<div class="pv-segment">';
    bodyHTML += '  <div class="pv-segment-header">';
    bodyHTML += '    <div class="pv-segment-dot" style="background:' + data.accentColor + '"></div>';
    bodyHTML += '    <div class="pv-segment-info">';
    bodyHTML += '      <div class="pv-segment-label">' + seg.label + '</div>';
    bodyHTML += '      <div class="pv-segment-time">' + seg.time + '</div>';
    bodyHTML += '    </div>';
    bodyHTML += '  </div>';
    bodyHTML += '  <div class="pv-segment-tasks">';
    // Calculate max duration for bar scaling
    var maxDur = 0;
    seg.tasks.forEach(function(task) {
      var d = parseInt(task.duration) || 0;
      if (d > maxDur) maxDur = d;
    });

    seg.tasks.forEach(function(task) {
      var d = parseInt(task.duration) || 0;
      var barW = maxDur > 0 ? (d / maxDur * 100).toFixed(1) : 50;
      bodyHTML += '    <div class="pv-task-row">';
      bodyHTML += '      <div class="pv-task-dot"></div>';
      bodyHTML += '      <div class="pv-task-info">';
      bodyHTML += '        <span class="pv-task-name">' + task.name + '</span>';
      bodyHTML += '        <div class="pv-task-bar"><div class="pv-task-bar-fill" style="width:' + barW + '%"></div></div>';
      bodyHTML += '      </div>';
      bodyHTML += '      <div class="pv-task-dur">' + task.duration + '</div>';
      bodyHTML += '    </div>';
    });
    bodyHTML += '  </div>';
    bodyHTML += '</div>';
  });
  bodyEl.innerHTML = bodyHTML;

  // Render timeline
  renderTimeline(data);

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function renderTimeline(data) {
  // Parse all segment times to find total range
  var allMinutes = [];
  data.segments.forEach(function(seg) {
    var parts = seg.time.split('—');
    if (parts.length === 2) {
      var start = parseTime(parts[0].trim());
      var end = parseTime(parts[1].trim());
      if (start !== null && end !== null) {
        allMinutes.push({ s: start, e: end, label: seg.label });
      }
    }
  });
  if (allMinutes.length === 0) return;

  var minT = Math.min.apply(null, allMinutes.map(function(m) { return m.s; }));
  var maxT = Math.max.apply(null, allMinutes.map(function(m) { return m.e; }));
  var totalRange = Math.max(maxT - minT, 1);

  // Fill bar: colored segments proportional to duration
  var fillEl = document.getElementById('timelineFill');
  var fillHTML = '';
  allMinutes.forEach(function(m, i) {
    var left = ((m.s - minT) / totalRange * 100).toFixed(2);
    var width = ((m.e - m.s) / totalRange * 100).toFixed(2);
    fillHTML += '<div class="pv-tl-seg" style="left:' + left + '%;width:' + width + '%;background:' + data.accentColor + ';opacity:' + (1 - i * 0.15).toFixed(2) + ';transition-delay:' + (i * 120) + 'ms" title="' + m.label + '"></div>';
  });
  fillEl.innerHTML = fillHTML;

  // Time labels
  var labelsEl = document.getElementById('timelineLabels');
  var startLabel = formatTime(minT);
  var endLabel = formatTime(maxT);
  labelsEl.innerHTML = '<span class="pv-tl-label pv-tl-label--start">' + startLabel + '</span><span class="pv-tl-label pv-tl-label--end">' + endLabel + '</span>';

  // Range text
  var rangeEl = document.getElementById('timelineRange');
  rangeEl.textContent = startLabel + ' — ' + endLabel + ' · 共 ' + (totalRange >= 60 ? Math.round(totalRange / 60) + ' 小时 ' + (totalRange % 60) + ' 分钟' : totalRange + ' 分钟');
}

function parseTime(str) {
  var parts = str.split(':');
  if (parts.length === 2) {
    var h = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);
    if (!isNaN(h) && !isNaN(m)) return h * 60 + m;
  }
  return null;
}

function formatTime(mins) {
  var h = Math.floor(mins / 60);
  var m = mins % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}

function closePreview() {
  const overlay = document.getElementById('previewOverlay');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

/* Collapsible task preview */
function toggleTasks(id) {
  const el = document.getElementById(id);
  const list = el.querySelector('.task-preview-list');
  const toggle = el.querySelector('.task-preview-toggle');
  const isOpen = list.classList.contains('is-open');

  if (isOpen) {
    list.style.maxHeight = list.scrollHeight + 'px';
    requestAnimationFrame(() => {
      list.style.maxHeight = '0px';
      list.style.opacity = '0';
    });
    setTimeout(() => { list.classList.remove('is-open'); }, 300);
    toggle.setAttribute('aria-expanded', 'false');
  } else {
    list.classList.add('is-open');
    toggle.setAttribute('aria-expanded', 'true');
    list.style.maxHeight = '0px';
    list.style.opacity = '0';
    requestAnimationFrame(() => {
      list.style.maxHeight = list.scrollHeight + 'px';
      list.style.opacity = '1';
    });
    setTimeout(() => { list.style.maxHeight = ''; }, 320);
  }
}
