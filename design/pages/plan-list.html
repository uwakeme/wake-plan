/* Wake Plan — Brand Design Tokens v4 */
/* Design Philosophy: Temporal Clarity — Bold Edition */
/* Supports: Light (default) + Dark themes */
/* Brand Prefix: wp */

/* ===== Google Fonts Import ===== */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

/* ===== LIGHT THEME (Default) ===== */
:root {
  color-scheme: light;
  --color-primary: #C48520;
  --color-primary-hover: #A86F14;
  --color-primary-light: rgba(196, 133, 32, 0.08);
  --color-primary-surface: rgba(196, 133, 32, 0.04);
  --color-bg: #F2F0EC;
  --color-bg-elevated: #FAFAF8;
  --color-bg-overlay: #EAE7E2;
  --color-bg-card: #FFFFFF;
  --color-bg-card-hover: #F8F7F5;
  --color-bg-input: #EAE7E2;
  --color-text-primary: #18160F;
  --color-text-secondary: #6E695E;
  --color-text-tertiary: #A5A099;
  --color-text-inverse: #FAFAF8;
  --color-border: rgba(24, 22, 15, 0.07);
  --color-border-strong: rgba(24, 22, 15, 0.14);
  --color-border-subtle: rgba(24, 22, 15, 0.03);
  --state-success: #2E9B5E;
  --state-success-light: rgba(46, 155, 94, 0.08);
  --state-warning: #D4901A;
  --state-warning-light: rgba(212, 144, 26, 0.08);
  --state-error: #C84545;
  --state-error-light: rgba(200, 69, 69, 0.08);
  --state-info: #3B6FB5;
  --state-info-light: rgba(59, 111, 181, 0.08);
  --font-display: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-body: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --text-2xs: 10px; --text-2xs-lh: 14px;
  --text-xs: 11px; --text-xs-lh: 16px;
  --text-sm: 13px; --text-sm-lh: 18px;
  --text-base: 15px; --text-base-lh: 22px;
  --text-lg: 17px; --text-lg-lh: 24px;
  --text-xl: 20px; --text-xl-lh: 28px;
  --text-2xl: 28px; --text-2xl-lh: 36px;
  --text-3xl: 36px; --text-3xl-lh: 44px;
  --text-display: 60px; --text-display-lh: 66px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --letter-spacing-tight: -0.04em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.06em;
  --letter-spacing-wider: 0.12em;
  --space-2xs: 2px; --space-xs: 4px; --space-sm: 8px; --space-md: 12px;
  --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px;
  --space-3xl: 32px; --space-4xl: 40px; --space-5xl: 56px;
  --radius-xs: 6px; --radius-sm: 8px; --radius-md: 12px;
  --radius-lg: 16px; --radius-xl: 22px; --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03), 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
  --shadow-glow-primary: 0 0 30px rgba(196, 133, 32, 0.15), 0 0 8px rgba(196, 133, 32, 0.08);
  --shadow-glow-success: 0 0 20px rgba(46, 155, 94, 0.12);
  --transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 260ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 380ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-toggle: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-spring: 480ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-bounce: 600ms cubic-bezier(0.22, 1, 0.36, 1);
  --noise-opacity: 0.008;
  --toggle-off-track: rgba(24, 22, 15, 0.08);
  --toggle-off-knob: #FFFFFF;
  --toggle-on-track: #C48520;
  --toggle-on-knob: #FFFFFF;
  --tab-bar-bg: rgba(250, 250, 248, 0.90);
}

/* ===== DARK THEME ===== */
html.dark {
  color-scheme: dark;
  --color-primary: #F0B44A;
  --color-primary-hover: #D4962E;
  --color-primary-light: rgba(240, 180, 74, 0.10);

  --color-text-primary: #F0F2F8;
  --color-text-secondary: #8492AD;
  --color-text-tertiary: #4F5E78;
  --color-text-inverse: #090E1A;
  --color-border: rgba(132, 146, 173, 0.08);
  --color-border-strong: rgba(132, 146, 173, 0.18);
  --color-border-subtle: rgba(132, 146, 173, 0.04);
  --state-success: #5DB88A;
  --state-success-light: rgba(93, 184, 138, 0.10);
  --state-warning: #F0B44A;
  --state-warning-light: rgba(240, 180, 74, 0.10);
  --state-error: #E85C5C;
  --state-error-light: rgba(232, 92, 92, 0.10);
  --state-info: #4A90D9;
  --state-info-light: rgba(74, 144, 217, 0.10);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.10), 0 1px 4px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.16), 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.22), 0 4px 16px rgba(0, 0, 0, 0.10);
  --shadow-glow-primary: 0 0 30px rgba(240, 180, 74, 0.18), 0 0 8px rgba(240, 180, 74, 0.10);
  --shadow-glow-success: 0 0 20px rgba(93, 184, 138, 0.14);
  --noise-opacity: 0.018;
  --toggle-off-track: rgba(132, 146, 173, 0.14);
  --toggle-off-knob: #8492AD;
  --toggle-on-track: #F0B44A;
  --toggle-on-knob: #FFFFFF;
  --tab-bar-bg: #121A2C;
}

/* ===== Shared Entrance Animations ===== */
@keyframes wp-fade-in-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes wp-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes wp-scale-in {
  from { opacity: 0; transform: scale(0.90); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes wp-progress-fill {
  from { width: 0; }
}
@keyframes wp-slide-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes wp-slide-down {
  from { opacity: 0; max-height: 0; }
  to { opacity: 1; max-height: 400px; }
}
.wp-animate-in {
  animation: wp-fade-in-up 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.wp-animate-scale {
  animation: wp-scale-in 400ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.wp-animate-fade {
  animation: wp-fade-in 320ms ease both;
}
.wp-animate-progress {
  animation: wp-progress-fill 680ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ===== Accessibility ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--color-bg);
    color: var(--color-text-primary);
    font-family: 'Outfit', 'Noto Sans SC', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  /* Noise texture overlay on body */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    z-index: 9999;
  }

  /* ===== Shell ===== */
  .wp-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    max-width: 390px;
    margin: 0 auto;
    background: var(--color-bg);
    overflow: hidden;
    position: relative;
  }

  /* ===== Status Bar ===== */
  .wp-status-bar {
    height: env(safe-area-inset-top, 0px);
    min-height: env(safe-area-inset-top, 0px);
    flex-shrink: 0;
    background: var(--color-bg);
  }

  /* ===== Header ===== */
  .wp-plan-header {
    flex-shrink: 0;
    padding: 20px 20px 32px 20px;
    background: var(--color-bg);
  }

  .wp-plan-header__title {
    font-family: 'Outfit', 'Noto Sans SC', sans-serif;
    font-size: 26px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--color-text-primary);
  }

  .wp-plan-header__top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .wp-tpl-entry-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--color-bg-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    color: var(--color-text-secondary);
    font-family: 'Outfit', 'Noto Sans SC', sans-serif;
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all var(--transition-fast);
    flex-shrink: 0;
    outline: none;
    letter-spacing: 0.02em;
  }

  .wp-tpl-entry-btn:hover {
    border-color: var(--color-primary);
    color: var(--color-primary);
    background: var(--color-primary-surface);
  }

  .wp-tpl-entry-btn:active {
    transform: scale(0.96);
    transition-duration: 100ms;
  }

  .wp-tpl-entry-btn:focus-visible {
    box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-primary);
  }

  .wp-plan-header__subtitle {
    font-family: 'Outfit', 'Noto Sans SC', sans-serif;
    font-size: 13px;
    line-height: 18px;
    font-weight: 400;
    color: var(--color-text-tertiary);
    margin-top: 4px;
  }

  /* ===== Scrollable Card List ===== */
  .wp-card-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 0 20px 120px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .wp-card-list::-webkit-scrollbar {
    display: none;
  }

  .wp-card-list {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  /* ===== Plan Card ===== */
  .wp-plan-card {
    display: flex;
    align-items: stretch;
    background: var(--color-bg-card);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    border: 1px solid var(--color-border-subtle);
    transition: background 280ms cubic-bezier(0.4, 0, 0.2, 1),
                border-color 280ms cubic-bezier(0.4, 0, 0.2, 1),
                transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .wp-plan-card:active {
    background: var(--color-bg-card-hover);
    transform: scale(0.985);
    transition-duration: 120ms;
  }

  .wp-plan-card:hover {
    border-color: var(--color-border-strong);
    background: var(--color-bg-card-hover);
  }

  /* Left color stripe */
  .wp-plan-card__stripe {
    width: 3px;
    flex-shrink: 0;
    background: var(--plan-color);
  }

  /* Card body */
  .wp-plan-card__body {
    flex: 1;
    padding: 16px 16px 16px 14px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Top row: title + chevron */
  .wp-plan-card__top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .wp-plan-card__info {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    flex: 1;
  }

  .wp-plan-card__title {
    font-family: 'Outfit', 'Noto Sans SC', sans-serif;
    font-size: 17px;
    line-height: 24px;
    font-weight: 600;
    color: var(--color-text-primary);
    letter-spacing: -0.01em;
  }

  .wp-plan-card__date {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    line-height: 16px;
    font-weight: 400;
    color: var(--color-text-tertiary);
  }

  .wp-plan-card__chevron {
    flex-shrink: 0;
    color: var(--color-text-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 2px;
    margin-left: 8px;
    transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .wp-plan-card:active .wp-plan-card__chevron {
    transform: translateX(2px);
  }

  /* Stats line */
  .wp-plan-card__stats {
    font-family: 'Outfit', 'Noto Sans SC', sans-serif;
    font-size: 13px;
    line-height: 18px;
    font-weight: 400;
    color: var(--color-text-secondary);
  }

  /* Progress bar */
  .wp-plan-card__progress-track {
    height: 3px;
    width: 100%;
    border-radius: 9999px;
    background: var(--color-border-subtle);
    overflow: hidden;
  }

  .wp-plan-card__progress-fill {
    height: 100%;
    width: var(--progress);
    min-width: 0;
    border-radius: 9999px;
    background: linear-gradient(90deg, var(--plan-color), color-mix(in srgb, var(--plan-color) 70%, white));
    transition: width 400ms cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 8px color-mix(in srgb, var(--plan-color) 30%, transparent);
    animation: wp-progress-fill 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: 500ms;
  }

  /* ===== FAB ===== */
  .wp-fab {
    position: absolute;
    bottom: calc(60px + env(safe-area-inset-bottom, 0px) + 20px);
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--color-primary);
    color: var(--color-text-inverse);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-float),
                var(--shadow-glow-primary);
    z-index: 50;
    transition: transform 180ms cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 180ms cubic-bezier(0.4, 0, 0.2, 1);
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  .wp-fab:focus-visible {
    box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-primary), var(--shadow-float);
  }

  .wp-fab:hover {
    box-shadow: 0 8px 40px rgba(232, 168, 62, 0.35),
                0 0 32px rgba(232, 168, 62, 0.18);
  }

  .wp-fab:active {
    transform: scale(0.92);
    box-shadow: 0 4px 16px rgba(232, 168, 62, 0.20),
                0 0 16px rgba(232, 168, 62, 0.08);
    transition-duration: 120ms;
  }

  .wp-fab svg {
    width: 24px;
    height: 24px;
  }

  /* ===== Bottom Tab Bar ===== */
  .wp-tab-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    height: 60px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--tab-bar-bg);
    border-top: 1px solid var(--color-border-subtle);
    position: relative;
    z-index: 100;
  }

  .wp-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    flex: 1;
    height: 100%;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-tertiary);
    transition: color 180ms cubic-bezier(0.4, 0, 0.2, 1);
    padding: 0;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .wp-tab:focus-visible {
    box-shadow: 0 0 0 2px var(--color-primary);
    border-radius: 8px;
  }

  .wp-tab:hover {
    color: var(--color-text-secondary);
  }

  .wp-tab--active {
    color: var(--color-primary);
  }

  .wp-tab svg {
    transition: color 180ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .wp-tab__label {
    font-family: 'Outfit', 'Noto Sans SC', sans-serif;
    font-size: 11px;
    line-height: 16px;
    font-weight: 500;
    letter-spacing: 0.06em;
    transition: color 180ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ===== Theme Toggle ===== */
  .wp-theme-toggle {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--color-bg-card);
    color: var(--color-text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 180ms ease, color 180ms ease;
  }

  .wp-theme-toggle:hover {
    color: var(--color-text-primary);
  }

  .wp-theme-toggle:focus-visible {
    box-shadow: 0 0 0 2px var(--color-primary);
  }

  .wp-theme-toggle__icon {
    position: absolute;
  }

  .wp-theme-toggle__icon--dark {
    display: none;
  }

  .wp-theme-toggle__icon--light {
    display: block;
  }

  html.dark .wp-theme-toggle__icon--dark {
    display: block;
  }

  html.dark .wp-theme-toggle__icon--light {
    display: none;
  }
</style>
<script>
function toggleTheme() {
  const html = document.documentElement;
  html.classList.add('theme-transitioning');
  html.classList.toggle('dark');
  localStorage.setItem('wp-theme', html.classList.contains('dark') ? 'dark' : 'light');
  setTimeout(() => html.classList.remove('theme-transitioning'), 500);
}
(function() {
  const saved = localStorage.getItem('wp-theme');
  if (saved === 'dark') document.documentElement.classList.add('dark');
  else if (saved === 'light') document.documentElement.classList.remove('dark');
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
})();
</script>
</body>
</html>
