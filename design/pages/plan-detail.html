/* ===== LIGHT THEME (Default) ===== */

  --color-border: rgba(24, 22, 15, 0.07);
  --color-border-strong: rgba(24, 22, 15, 0.14);
  --color-border-subtle: rgba(24, 22, 15, 0.03);
  --state-success: #2E9B5E;
  --state-success-light: rgba(46, 155, 94, 0.08);
  --state-warning: #D4901A;
  --state-warning-light: rgba(212, 144, 26, 0.08);
  --state-error: #C84545;
  --state-error-light: rgba(200, 69, 69, 0.08);
  --state-info: #3B6FB5;
  --state-info-light: rgba(59, 111, 181, 0.08);
  --font-display: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-body: 'DM Sans', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --text-2xs: 10px; --text-2xs-lh: 14px;
  --text-xs: 11px; --text-xs-lh: 16px;
  --text-sm: 13px; --text-sm-lh: 18px;
  --text-base: 15px; --text-base-lh: 22px;
  --text-lg: 17px; --text-lg-lh: 24px;
  --text-xl: 20px; --text-xl-lh: 28px;
  --text-2xl: 28px; --text-2xl-lh: 36px;
  --text-3xl: 36px; --text-3xl-lh: 44px;
  --text-display: 60px; --text-display-lh: 66px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --letter-spacing-tight: -0.04em;

  --letter-spacing-wide: 0.06em;
  --letter-spacing-wider: 0.12em;
  --space-2xs: 2px; --space-xs: 4px; --space-sm: 8px; --space-md: 12px;
  --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px;
  --space-3xl: 32px; --space-4xl: 40px; --space-5xl: 56px;
  --radius-xs: 6px; --radius-sm: 8px; --radius-md: 12px;
  --radius-lg: 16px; --radius-xl: 22px; --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03), 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
  --shadow-glow-primary: 0 0 30px rgba(196, 133, 32, 0.15), 0 0 8px rgba(196, 133, 32, 0.08);
  --shadow-glow-success: 0 0 20px rgba(46, 155, 94, 0.12);
  --transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 260ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 380ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-toggle: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-spring: 480ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-bounce: 600ms cubic-bezier(0.22, 1, 0.36, 1);
  --noise-opacity: 0.008;
  --toggle-off-track: rgba(24, 22, 15, 0.08);
  --toggle-off-knob: #FFFFFF;
  --toggle-on-track: #C48520;

/* ===== DARK THEME ===== */

  --color-text-secondary: #8492AD;
  --color-text-tertiary: #4F5E78;
  --color-text-inverse: #090E1A;
  --color-border: rgba(132, 146, 173, 0.08);
  --color-border-strong: rgba(132, 146, 173, 0.18);
  --color-border-subtle: rgba(132, 146, 173, 0.04);
  --state-success: #5DB88A;
  --state-success-light: rgba(93, 184, 138, 0.10);
  --state-warning: #F0B44A;
  --state-warning-light: rgba(240, 180, 74, 0.10);
  --state-error: #E85C5C;
  --state-error-light: rgba(232, 92, 92, 0.10);
  --state-info: #4A90D9;
  --state-info-light: rgba(74, 144, 217, 0.10);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.10), 0 1px 4px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.16), 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.22), 0 4px 16px rgba(0, 0, 0, 0.10);
  --shadow-glow-primary: 0 0 30px rgba(240, 180, 74, 0.18), 0 0 8px rgba(240, 180, 74, 0.10);
  --shadow-glow-success: 0 0 20px rgba(93, 184, 138, 0.14);
  --noise-opacity: 0.018;
  --toggle-off-track: rgba(132, 146, 173, 0.14);
  --toggle-off-knob: #8492AD;
  --toggle-on-track: #F0B44A;
  --toggle-on-knob: #FFFFFF;
  --tab-bar-bg: #121A2C;
}

/* ===== Shared Entrance Animations ===== */
@keyframes wp-fade-in-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes wp-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes wp-scale-in {
  from { opacity: 0; transform: scale(0.90); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes wp-progress-fill {
  from { width: 0; }
}
@keyframes wp-slide-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes wp-slide-down {
  from { opacity: 0; max-height: 0; }
  to { opacity: 1; max-height: 400px; }
}
.wp-animate-in {
  animation: wp-fade-in-up 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.wp-animate-scale {
  animation: wp-scale-in 400ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.wp-animate-fade {
  animation: wp-fade-in 320ms ease both;
}
.wp-animate-progress {
  animation: wp-progress-fill 680ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ===== Accessibility ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== Reset & Base ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {

  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-text-primary);

  font-size: var(--text-sm);

}

/* Noise texture overlay */
body::after {

  inset: 0;
  pointer-events: none;
  z-index: 9999;

  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 128px 128px;
}

/* ===== Layout Shell ===== */
.shell {

}

/* ===== Top Bar ===== */
.topbar {

.topbar-back:hover {

}

.topbar-back:active {

.topbar-title {

.divider {

    <script>
function toggleTheme() {
  const html = document.documentElement;
  html.classList.add('theme-transitioning');
  html.classList.toggle('dark');
  localStorage.setItem('wp-theme', html.classList.contains('dark') ? 'dark' : 'light');
  setTimeout(() => html.classList.remove('theme-transitioning'), 500);
}
(function() {
  const saved = localStorage.getItem('wp-theme');
  if (saved === 'dark') document.documentElement.classList.add('dark');
  else if (saved === 'light') document.documentElement.classList.remove('dark');
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
})();
</script>
